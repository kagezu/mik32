; MIK32 - AMUR -------------------------------------------------------

[MIK32]
platform = MIK32
board = mik32v2
framework = framework-mik32v2-sdk
board_build.f_cpu = 32000000L
lib_ignore = avr
board_upload.maximum_size=65536       ; 64K
board_custom = ./
build_flags = 
  -DMIK32V2
  -Wl,--undefined=SystemInit

[env:MIK32-USB]
extends = MIK32
board_build.ldscript = spifi
upload_port = usb
; targets = buildprog
; upload_command = ./tools/uploader/uploader --com /dev/ttyUSB0 --baudrate 921600 $SOURCE
upload_command = ./tools/uploader/uploader --com /dev/ttyUSB0 $SOURCE
; targets = buildbin

[env:MIK32-JTAG]
extends = MIK32
upload_protocol = mikron-link
upload_speed = 500
; board_build.ldscript = spifi
board_build.ldscript = ram
; board_build.ldscript = eeprom

; AVR - ATmega328P ---------------------------------------------------

[AVR]
platform = atmelavr
board = uno
framework = arduino
lib_ignore = mik32
build_flags = 
	-Wl,--defsym=__stack=0x08FF
	-Wl,-Tdata,0x800100

[env:AVR-25MHz]
extends = AVR
board_build.f_cpu = 25000000L

[env:AVR-16MHz]
extends = AVR
board_build.f_cpu = 16000000L
