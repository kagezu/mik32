; MIK32 - AMUR -------------------------------------------------------

[MIK32]
platform = MIK32
board = mik32v2
framework = framework-mik32v2-sdk
lib_ignore = avr
board_upload.maximum_size=65536       ; 64K
; board_upload.maximum_size=33554432  ; 32M

board_build.ldscript = spifi
; board_build.ldscript = ram
; board_build.ldscript = eeprom

[env:MIK32-USB]
extends = MIK32
upload_port = usb
upload_command = ./custom/uploader/uploader --com /dev/ttyUSB0 $SOURCE

[env:MIK32-JTAG]
extends = MIK32
upload_protocol = mikron-link
upload_speed = 500

; AVR - ATmega328P ---------------------------------------------------

[AVR]
platform = atmelavr
board = uno
framework = arduino
lib_ignore = mik32
build_flags = 
	-Wl,--defsym=__stack=0x08FF
	-Wl,-Tdata,0x800100

[env:AVR-25MHz]
extends = AVR
board_build.f_cpu = 25000000L

[env:AVR-16MHz]
extends = AVR
board_build.f_cpu = 16000000L
